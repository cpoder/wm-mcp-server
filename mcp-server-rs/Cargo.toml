[package]
name = "wm-mcp-server"
version = "2.12.1"
edition = "2024"
description = "MCP server for webMethods Integration Server — 345 tools replacing Designer for development and administration"
license = "MIT"
repository = "https://github.com/cpoder/wm-mcp-server"
keywords = ["mcp", "webmethods", "integration-server"]
categories = ["development-tools"]

[[bin]]
name = "wm-mcp-server"
path = "src/main.rs"

[dependencies]
# >=1.4 required: patches RUSTSEC-2026-0189 (DNS rebinding in the Streamable
# HTTP server transport) and provides the Host-allowlist builder API.
rmcp = { version = "1.8", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "signal"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
base64 = "0.22"
urlencoding = "2.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

[profile.release]
strip = true
lto = true
opt-level = "z"
